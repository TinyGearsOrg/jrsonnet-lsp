# SPDX-License-Identifier: MIT
# Local hooks, run with prek or pre-commit (see the README); CI stays the gate.
default_install_hook_types: [pre-commit]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    # patches/ holds diffs of someone else's code. A patch has to match its target byte for byte,
    # so fixers that rewrite blank lines, trailing spaces or line endings can make one stop
    # applying. (The current patch happens to survive them; a future one may not.)
    - id: end-of-file-fixer
      exclude: ^patches/
    - id: mixed-line-ending
      exclude: ^patches/
    - id: trailing-whitespace
      exclude: ^patches/
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
    - id: shellcheck
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.1
  hooks:
    - id: zizmor
      args: [ --min-severity, low ]
