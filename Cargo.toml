[package]
name = "jsonnet-lsp"
description = "Language server for Jsonnet, built on jrsonnet's rowan CST parser"
version = "0.0.3"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
lsp-server = "0.7"
lsp-types = "0.97"
serde = "1"
serde_json = "1"
# Pinned: jrsonnet is pre-1.0 and its CST/AST API moves.
jrsonnet-rowan-parser = { git = "https://github.com/deltarocks/jrsonnet", rev = "0648267066e6c135477933c792285de74184e9cb" }
jrsonnet-formatter = { git = "https://github.com/deltarocks/jrsonnet", rev = "0648267066e6c135477933c792285de74184e9cb" }

[profile.release]
strip = true
