name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing by default; each job asks for what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Use the latest stable directly, without rustup installing the extra components that
  # rust-toolchain.toml lists for developers (rust-analyzer, rust-src).
  RUSTUP_TOOLCHAIN: stable

jobs:
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make init
      - run: make lint
      - run: make test-server
      # The static musl build is what ships for Linux, so test that one too.
      - run: cargo test --target x86_64-unknown-linux-musl

  extension:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make init
      - run: make test-extension
      # The integration tests start a real VS Code under a virtual display.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: extension/.vscode-test
          key: vscode-${{ runner.os }}-1.140.0
      - run: make build-server
      - run: xvfb-run -a make test-integration
        env:
          VSCODE_VERSION: 1.140.0
      # Packaging has to keep working too.
      - run: make package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-linux-x64
          path: extension/*.vsix

  # The same tests, and the extension in a real VS Code, on the other operating systems.
  other-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ./scripts/setup-jrsonnet.sh
      - run: cargo test
      - name: Extension unit tests
        working-directory: extension
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: The extension in a real VS Code
        working-directory: extension
        run: |
          cargo build --release --manifest-path ../Cargo.toml
          npm run compile
          npm run test:integration
        env:
          VSCODE_VERSION: 1.140.0
