name: Release

# Push a tag like v0.1.0 (matching the version in extension/package.json) to build the
# platform-specific VSIXes and attach them to a GitHub release. They are also published to Open VSX,
# with trusted publishing (OpenID Connect, no stored token), once the repository variable
# OPEN_VSX_PUBLISH is set to "true". Until then a release only creates the GitHub release, whose
# VSIXes can be uploaded to Open VSX by hand. See "Releasing" in extension/README.md.
#
# Running the workflow by hand (Actions, Run workflow) builds and packages everything without
# releasing or publishing, which is how to check a change to this file.
#
# No build cache is used here (nor in setup-node): a release must not be built from a cache that
# another workflow could have poisoned.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `vsce` lists the VS Code targets built from one binary (`vsce package --target`),
        # `platform` is the target of that binary and `rust` its Rust target. `smoke` says whether
        # the binary can run on the build machine, so that it is started and checked there.
        #
        # Linux is a static musl binary: it runs on any distribution regardless of glibc, and is
        # also the right binary for Alpine.
        include:
          - { vsce: 'linux-x64,alpine-x64', platform: linux-x64, os: ubuntu-latest, rust: x86_64-unknown-linux-musl, smoke: true }
          - { vsce: 'linux-arm64,alpine-arm64', platform: linux-arm64, os: ubuntu-24.04-arm, rust: aarch64-unknown-linux-musl, smoke: true }
          - { vsce: darwin-arm64, platform: darwin-arm64, os: macos-latest, rust: aarch64-apple-darwin, smoke: true }
          - { vsce: darwin-x64, platform: darwin-x64, os: macos-latest, rust: x86_64-apple-darwin, smoke: false }
          - { vsce: win32-x64, platform: win32-x64, os: windows-latest, rust: x86_64-pc-windows-msvc, smoke: true }
          - { vsce: win32-arm64, platform: win32-arm64, os: windows-latest, rust: aarch64-pc-windows-msvc, smoke: false }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: The tag matches the extension's version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./extension/package.json').version")" = "$GITHUB_REF_NAME"
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.rust }}
      - run: ./scripts/setup-jrsonnet.sh
      - run: cargo build --release --target ${{ matrix.rust }}
      - name: The binary starts and speaks LSP
        if: ${{ matrix.smoke }}
        run: |
          exe=jsonnet-lsp
          case "${{ matrix.platform }}" in win32-*) exe=jsonnet-lsp.exe ;; esac
          node extension/scripts/smoke-server.mjs target/${{ matrix.rust }}/release/$exe
      - name: Bundle the server and package the extension
        working-directory: extension
        run: |
          npm ci
          exe=jsonnet-lsp
          case "${{ matrix.platform }}" in win32-*) exe=jsonnet-lsp.exe ;; esac
          node scripts/bundle-server.mjs --platform ${{ matrix.platform }} --binary ../target/${{ matrix.rust }}/release/$exe
          node scripts/package.mjs --target ${{ matrix.vsce }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ matrix.platform }}
          path: extension/*.vsix

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/*.vsix --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  # Kept apart from the job above: this is the only one that may ask GitHub for an OIDC token, so
  # it installs only ovsx (from publish/, apart from the extension's own dependencies) without
  # running any install scripts, and has no write access to the repository. `--skip-duplicate`
  # makes a re-run after a partial failure safe.
  open-vsx:
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/') && vars.OPEN_VSX_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true
      - name: Publish with trusted publishing
        working-directory: publish
        run: |
          npm ci --ignore-scripts
          npx ovsx publish --trusted-publishing --skip-duplicate --packagePath ../dist/*.vsix
