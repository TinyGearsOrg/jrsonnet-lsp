# Use a sibling jrsonnet checkout (`../jrsonnet`, on a branch that exports `SyntaxError`, which
# the pinned upstream rev does not) instead of the pinned rev. Paths are relative to this repo.
# Drop this once the export is released upstream and the pin in Cargo.toml is bumped.
[patch."https://github.com/deltarocks/jrsonnet"]
jrsonnet-lexer = { path = "../jrsonnet/crates/jrsonnet-lexer" }
jrsonnet-rowan-parser = { path = "../jrsonnet/crates/jrsonnet-rowan-parser" }
jrsonnet-formatter = { path = "../jrsonnet/crates/jrsonnet-formatter" }
